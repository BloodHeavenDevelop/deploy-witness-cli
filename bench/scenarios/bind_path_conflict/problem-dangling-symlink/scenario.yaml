id: bind_path_conflict/problem-dangling-symlink
rule: witness.bind_path_conflict
situation: problem
description: >-
  The bind source ./link exists as a symbolic link, but it points to ./nodir, which does not; with create_host_path: false the mount has no source. The link itself must not count as the path.
regression: DW-95
project: bench
audit:
  user: root
  args: ["--sections", "ports,witness"]
expect:
  outcome: problem
docker:
  outcome: fails
