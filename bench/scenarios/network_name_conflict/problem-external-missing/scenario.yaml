id: network_name_conflict/problem-external-missing
rule: witness.network_name_conflict
situation: problem
description: >-
  The plan joins an external network edge that does not exist.
critical: true
project: bench
audit:
  user: root
  args: ["--sections", "ports,witness"]
expect:
  outcome: problem
docker:
  outcome: fails
  pattern: "could not be found"
