id: container_name_conflict/problem-foreign
rule: witness.container_name_conflict
situation: problem
description: >-
  A container named "web", created by hand, already exists; the plan fixes container_name: web.
critical: true
regression: DW-52
project: bench
audit:
  user: root
  args: ["--sections", "ports,witness"]
expect:
  outcome: problem
docker:
  outcome: fails
  pattern: "already in use"
