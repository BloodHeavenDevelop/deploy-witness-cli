# Unit tests, the pilot regressions (TestPilotRegressions, DW-90) and vet, on every
# push and pull request. Needs nothing but Go: the build fetches public modules only.
name: test

on:
  push:
    paths-ignore: ["dist/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make vet
      - run: make test
