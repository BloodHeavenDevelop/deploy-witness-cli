id: project_ownership/problem-other-checkout
rule: witness.project_ownership
situation: problem
description: >-
  Another checkout of the same plan, in another directory, is deployed under the same project name; the planned up recreates that checkout's container as its own.
project: bench
audit:
  user: root
  args: ["--sections", "ports,witness"]
expect:
  outcome: problem
docker:
  outcome: succeeds
  pattern: "Recreate"
