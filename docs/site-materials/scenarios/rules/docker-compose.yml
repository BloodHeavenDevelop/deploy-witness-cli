# Control scenario for the rules decided by the Compose file itself (DW-73):
# one service that trips every manifest rule at once. run.sh creates the docker
# network "dwkit-net" (10.250.73.0/24) for the subnet-overlap check and removes
# it afterwards. ./missing.env is meant not to exist.
name: rules

services:
  rules-app:
    image: nginx:latest
    platform: linux/arm64
    privileged: true
    env_file: ./missing.env
    volumes:
      - /etc:/host-etc:ro
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        reservations:
          memory: 100g
    networks:
      - isolated

networks:
  isolated:
    ipam:
      config:
        - subnet: 10.250.73.0/24
