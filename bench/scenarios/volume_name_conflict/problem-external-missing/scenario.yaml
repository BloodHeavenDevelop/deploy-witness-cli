id: volume_name_conflict/problem-external-missing
rule: witness.volume_name_conflict
situation: problem
description: >-
  The plan mounts an external volume shared-data that does not exist.
critical: true
project: bench
audit:
  user: root
  args: ["--sections", "ports,witness"]
expect:
  outcome: problem
docker:
  outcome: fails
  pattern: "not found"
