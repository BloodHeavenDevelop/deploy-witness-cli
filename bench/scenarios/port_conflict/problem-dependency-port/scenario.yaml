id: port_conflict/problem-dependency-port
rule: witness.port_conflict
situation: problem
description: >-
  The planned run starts service "web" alone, but web depends_on db, so Compose starts db too — and db publishes 18080, which an unrelated container holds.
project: bench
audit:
  user: root
  args: ["--sections", "ports,witness", "--compose-service", "web"]
expect:
  outcome: problem
docker:
  up: ["up", "-d", "web"]
  outcome: fails
  pattern: "port is already allocated"
