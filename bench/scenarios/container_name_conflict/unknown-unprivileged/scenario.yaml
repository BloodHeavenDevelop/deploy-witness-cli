id: container_name_conflict/unknown-unprivileged
rule: witness.container_name_conflict
situation: unknown
description: >-
  A foreign container named web exists, and the audit cannot reach the engine.
project: bench
audit:
  user: unprivileged
  args: ["--sections", "ports,witness"]
expect:
  outcome: unknown
docker:
  outcome: fails
  pattern: "already in use"
